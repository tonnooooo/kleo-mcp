# Free fallback renderer: every 5 minutes a GitHub runner asks Kleo for one job that Vast.ai did not pick up
# (no credit, no matching offer) and renders it with the same worker image. Nothing runs on the owner's computer.
name: render-pool
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: { group: render-pool, cancel-in-progress: false }
permissions:
  contents: read
  packages: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Claim one job from Kleo
        id: claim
        env:
          KLEO_API: ${{ vars.KLEO_API }}
          POOL_SECRET: ${{ secrets.KLEO_POOL_SECRET }}
        run: |
          set -e
          R=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $POOL_SECRET" -H "content-type: application/json" \
              -d "{\"runner\":\"gha-${{ github.run_id }}\"}" "$KLEO_API/internal/pool/claim")
          JOB=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("job_id") or "")')
          SECRET=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("worker_secret") or "")')
          if [ -n "$SECRET" ]; then echo "::add-mask::$SECRET"; fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"
          if [ -z "$JOB" ]; then echo "no job waiting"; else echo "claimed job $JOB"; fi
      - name: Free disk space
        if: steps.claim.outputs.job != ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
                      /usr/local/.ghcup /usr/lib/jvm /usr/local/julia* /opt/az /usr/share/miniconda /opt/microsoft /usr/local/share/chromium || true
          sudo apt-get remove -y --purge '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' google-cloud-cli azure-cli firefox powershell mono-devel >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true; sudo apt-get clean || true
          sudo docker image prune -af || true
          df -h / | tail -1
      - name: Pull the worker image (~15 GB)
        if: steps.claim.outputs.job != ''
        run: docker pull ghcr.io/tonnooooo/kleo-worker:keou
      - name: Render
        if: steps.claim.outputs.job != ''
        env:
          KLEO_API: ${{ vars.KLEO_API }}
          KLEO_JOB_ID: ${{ steps.claim.outputs.job }}
          KLEO_SECRET: ${{ steps.claim.outputs.secret }}
        run: |
          docker run --rm --shm-size=1g \
            -e KLEO_API -e KLEO_JOB_ID -e KLEO_SECRET \
            -e KLEO_SELF_DESTRUCT_MIN=70 -e KLEO_RENDER_TIMEOUT_MIN=60 -e KLEO_KEOU_WORKERS=4 \
            ghcr.io/tonnooooo/kleo-worker:keou
