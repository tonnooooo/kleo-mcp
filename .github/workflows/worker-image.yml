# Builds the Kleo GPU worker image (Keou engine + models) on GitHub's servers and publishes it to ghcr.io.
# Nothing runs on or passes through the owner's computer. Triggered by changes under worker/ or by hand.
name: worker-image
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker-image.yml"]
  workflow_dispatch:
concurrency: { group: worker-image, cancel-in-progress: true }
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the image is ~11 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.keou
          push: true
          tags: |
            ghcr.io/tonnooooo/kleo-worker:keou
            ghcr.io/tonnooooo/kleo-worker:latest
            ghcr.io/tonnooooo/kleo-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/tonnooooo/kleo-mcp
            org.opencontainers.image.description=Kleo GPU worker with the Keou motion-design engine
      - name: Report
        run: echo "pushed ghcr.io/tonnooooo/kleo-worker:keou (${{ github.sha }})"
