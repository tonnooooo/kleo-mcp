# The same worker image, compressed with zstd instead of gzip, published to a SEPARATE tag.
#
# Why: half the wait for a video is a rented card unpacking this image, and it is not the network — ghcr serves
# 7.8 GB in about three minutes and the pull takes thirteen to twenty. gzip decompresses one thread per layer and
# two layers are 7 GB of the 7.8, so the card sits there paid and idle. zstd unpacks three to five times faster at
# the same size. See docs/PULL-IMMAGINE.md for the measurements.
#
# Why a separate file and a separate tag, and why it never runs on a push: zstd can fail CLOSED. A rented host with
# an old Docker does not understand it and the pull fails outright instead of being slow — which would take every
# video down rather than making it late. So this is built by hand, onto :keou-zstd, and measured against :keou on
# real rented machines with scripts/pulltest.py before anything points production at it.
# Nothing here runs on the owner's computer.
name: worker-image-zstd
on:
  workflow_dispatch:
concurrency: { group: worker-image-zstd, cancel-in-progress: true }
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (the image is ~15 GB with the picture models)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
                      /usr/local/.ghcup /usr/lib/jvm /usr/local/julia* /opt/az /usr/share/miniconda /opt/microsoft /usr/local/share/chromium || true
          sudo apt-get remove -y --purge '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' google-cloud-cli azure-cli firefox powershell mono-devel >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true; sudo apt-get clean || true
          sudo docker image prune -af || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (zstd)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.keou
          push: true
          # force-compression rewrites the layers that came out of the cache too. Without it the cached layers stay
          # gzip and the build publishes a mixture, which measures nothing.
          outputs: type=registry,compression=zstd,compression-level=3,force-compression=true
          tags: ghcr.io/tonnooooo/kleo-worker:keou-zstd
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=https://github.com/tonnooooo/kleo-mcp
            org.opencontainers.image.description=Kleo GPU worker, zstd-compressed (experiment, not production)
      - name: Report
        run: echo "pushed ghcr.io/tonnooooo/kleo-worker:keou-zstd — now compare with scripts/image-size.py, then measure the pull with scripts/pulltest.py"
