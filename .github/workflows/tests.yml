# The unit tests, on GitHub's machines. Nothing runs on the owner's computer: this is the only place, besides a
# rented Vast box, where `node --test` and the python suite are allowed to run at all.
# It renders nothing — no ffmpeg, no Playwright, no GPU. Pure logic: the contract, the shot grammar, the direction,
# the planner, the picture prompts and the engine's pure blocks.
name: tests
on:
  push:
    branches: ["**"]
    # scripts/** is in the list because the adaptation measurement lives there: without it, changing the measure did
    # not re-run the measure, and the report on the branch stayed the one from the previous commit.
    paths: ["src/**", "test/**", "worker/**", "scripts/**", "package.json", "tsconfig.json", ".github/workflows/tests.yml"]
  workflow_dispatch:
concurrency: { group: "tests-${{ github.ref }}", cancel-in-progress: true }
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }   # 22.18+ strips TypeScript types natively, which is how the tests import src/*.ts
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: How much of a video the prompt decides
        # A measurement, not a test of a rule: it prints the numbers and fails only if the planner picks the wrong
        # look for more than a quarter of ordinary requests. Runs here because nothing may run on the owner's PC.
        run: node scripts/adaptation.mjs
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: ffmpeg, numpy, pillow (the clip writer under test is real; the model is not)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy pillow
        # Until 13 September this job ran with no ffmpeg on purpose, and the clip export was a fake that wrote 64
        # zero bytes. The fake hid a production failure: the worker image could not save a single generated clip
        # (diffusers' exporter wanted a library the image does not ship) while the suite stayed green. The writer
        # now goes through ffmpeg for real on 16x16 frames — a probe of the writer, not a render — and the suite
        # fails here the day it stops producing a playable file. torch and the model stay fakes.
      - name: Worker tests (no torch, no GPU; ffmpeg only for the clip writer)
        working-directory: worker
        run: python3 -m unittest test_kleo_pictures test_kleo_worker_images test_kleo_video test_kleo_worker_video test_kleo_worker_footage -v
        # test_kleo_video and test_kleo_worker_video cover the generated-motion chain: the prompt the model is
        # given, the file the clip lands in, and whether the worker may attach a video backdrop at all. Neither
        # loads torch or touches a GPU (the pipeline is a fake), and both belong here because the failure they
        # guard against is only visible after a card has already been rented and paid for.
